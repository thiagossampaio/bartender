<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #FAFAFA; 
    color: #1A1A1A;
    padding: 50px 40px;  
  }
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header h1 {
    font-size: 42px;
    font-weight: 200;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    opacity: 0.45;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    max-width: 1180px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 14px;
    padding: 32px 26px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: 160px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
  }
  .logo svg { width: 100%; height: 100%; color: #1A1A1A; }
  .meta { text-align: center; }
  .meta .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.4;
    margin-bottom: 8px;
  }
  .meta .title {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Bartender</h1>
    <p>Label system &middot; 06 logo concepts</p>
  </div>
  <div class="grid">

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 100 100"><g fill="currentColor"><rect x="22" y="30" width="3" height="40" rx="1"/><rect x="29" y="35" width="2" height="30" rx="1"/><rect x="35" y="25" width="4" height="50" rx="1"/><rect x="43" y="32" width="2" height="36" rx="1"/><rect x="49" y="20" width="5" height="60" rx="1.5"/><rect x="58" y="35" width="2" height="30" rx="1"/><rect x="64" y="28" width="3" height="44" rx="1"/><rect x="71" y="32" width="2" height="36" rx="1"/><rect x="77" y="35" width="3" height="30" rx="1"/></g></svg>
      </div>
      <div class="meta">
        <div class="num">01 &middot; Rhythmic Bars</div>
        <div class="title">Barcode Bar</div>
      </div>
    </div>

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M 30 26 L 75 26 A 4 4 0 0 1 79 30 L 79 70 A 4 4 0 0 1 75 74 L 30 74 L 18 50 Z"/><circle cx="32" cy="50" r="2.5" fill="currentColor"/></g><g fill="currentColor"><rect x="44" y="42" width="28" height="2.5" rx="1"/><rect x="44" y="48.5" width="20" height="2.5" rx="1"/><rect x="44" y="55" width="24" height="2.5" rx="1"/></g></svg>
      </div>
      <div class="meta">
        <div class="num">02 &middot; Physical Artifact</div>
        <div class="title">Label Tag</div>
      </div>
    </div>

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 100 100"><g fill="currentColor"><rect x="28" y="22" width="5" height="56" rx="1.5"/><path d="M 33 22 L 53 22 A 14 14 0 0 1 53 50 L 33 50 Z M 33 27 L 53 27 A 9 9 0 0 1 53 45 L 33 45 Z" fill-rule="evenodd"/><rect x="39" y="55" width="2" height="18" rx="1"/><rect x="44" y="58" width="2" height="15" rx="1"/><rect x="49" y="55" width="3" height="18" rx="1"/><rect x="55" y="58" width="2" height="15" rx="1"/><rect x="60" y="55" width="2" height="18" rx="1"/><rect x="65" y="58" width="3" height="15" rx="1"/></g></svg>
      </div>
      <div class="meta">
        <div class="num">03 &middot; Monogram Hybrid</div>
        <div class="title">B Mark</div>
      </div>
    </div>

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 100 100"><g fill="currentColor"><rect x="22" y="22" width="10" height="10" rx="2"/><rect x="34" y="22" width="10" height="10" rx="2"/><rect x="46" y="22" width="10" height="10" rx="2"/><rect x="68" y="22" width="10" height="10" rx="2"/><rect x="22" y="34" width="10" height="10" rx="2"/><rect x="46" y="34" width="10" height="10" rx="2"/><rect x="68" y="34" width="10" height="10" rx="2"/><rect x="22" y="46" width="10" height="10" rx="2"/><rect x="34" y="46" width="10" height="10" rx="2"/><rect x="46" y="46" width="10" height="10" rx="2"/><rect x="58" y="46" width="10" height="10" rx="2"/><rect x="68" y="46" width="10" height="10" rx="2"/><rect x="22" y="58" width="10" height="10" rx="2"/><rect x="46" y="58" width="10" height="10" rx="2"/><rect x="68" y="58" width="10" height="10" rx="2"/><rect x="22" y="70" width="10" height="10" rx="2"/><rect x="34" y="70" width="10" height="10" rx="2"/><rect x="46" y="70" width="10" height="10" rx="2"/><rect x="68" y="70" width="10" height="10" rx="2"/></g></svg>
      </div>
      <div class="meta">
        <div class="num">04 &middot; Data Matrix</div>
        <div class="title">Matrix Grid</div>
      </div>
    </div>

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="38" cy="50" r="22" stroke-width="3"/><circle cx="38" cy="50" r="14" stroke-width="2" opacity="0.55"/><circle cx="38" cy="50" r="6" fill="currentColor" stroke="none"/></g><g fill="currentColor"><rect x="65" y="36" width="22" height="3" rx="1.5"/><rect x="65" y="44" width="16" height="3" rx="1.5"/><rect x="65" y="52" width="22" height="3" rx="1.5"/><rect x="65" y="60" width="13" height="3" rx="1.5"/></g></svg>
      </div>
      <div class="meta">
        <div class="num">05 &middot; Roll &amp; Output</div>
        <div class="title">Print Roll</div>
      </div>
    </div>

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 100 100"><g><rect x="22" y="22" width="48" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.35"/><rect x="28" y="32" width="48" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.65"/><rect x="34" y="42" width="48" height="34" rx="4" fill="currentColor"/></g><g fill="#FAFAFA"><rect x="40" y="50" width="22" height="2.5" rx="1"/><rect x="40" y="56" width="16" height="2.5" rx="1"/><rect x="40" y="63" width="1.5" height="8"/><rect x="43" y="63" width="1" height="8"/><rect x="45.5" y="63" width="2" height="8"/><rect x="49" y="63" width="1" height="8"/><rect x="51" y="63" width="1.5" height="8"/><rect x="54" y="63" width="2.5" height="8"/><rect x="58" y="63" width="1" height="8"/><rect x="60" y="63" width="1.5" height="8"/><rect x="63" y="63" width="1" height="8"/><rect x="65" y="63" width="2" height="8"/><rect x="68.5" y="63" width="1" height="8"/><rect x="71" y="63" width="2" height="8"/><rect x="74" y="63" width="1" height="8"/></g></svg>
      </div>
      <div class="meta">
        <div class="num">06 &middot; Multi-Column</div>
        <div class="title">Stacked Labels</div>
      </div>
    </div>

  </div>
</body>
</html>
