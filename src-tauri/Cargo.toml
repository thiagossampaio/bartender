[package]
name = "bartender"
version = "0.1.0"
description = "Bartender — aplicativo desktop offline-first para criação e impressão de etiquetas."
authors = ["Bartender Team"]
edition = "2021"
rust-version = "1.77"

# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique
# and not conflict with the binary name. See: https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "bartender_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.3"
tauri-plugin-fs = "2.0.3"
tauri-plugin-os = "2.0.1"
# SQLite local via plugin oficial Tauri 2.x (decisão R11: sqlx::migrate!).
# A feature `sqlite` baixa o driver embarcado; nada de servidor externo.
tauri-plugin-sql = { version = "2.0.3", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Wrapper de erros com `#[derive(Error)]` no módulo `db.rs`.
thiserror = "1.0"
# Sistema tipográfico (WP-06 / SPEC-05): enumeração de fontes do SO.
# `font-kit` cobre DirectWrite (Win), Core Text (macOS) e fontconfig (Linux).
# Em Linux usamos `source-fontconfig-dlopen` para evitar erro de link quando
# `libfontconfig-dev` não está instalado no build host (CI mínima).
font-kit = "0.14"
# Raster de fontes para o pipeline unificado preview ↔ PPLB raster
# (mitigação do risco R02 / SPEC-10 §"Pipeline raster"). Registrado já em
# WP-06 para que [WP-10] não precise re-discutir a dependência.
fontdue = "0.9"
# Exportação PDF vetorial (WP-08 / SPEC-08). `printpdf` cobre texto builtin
# (Helvetica), vetores (linhas, retângulos, beziers) e imagens raster
# embarcadas; suficiente para o pipeline `canvas_json` → PDF do MVP.
# `embedded_images` habilita o conversor `Image::try_from(<decoder>)` a
# partir das structs do crate `image` 0.24.
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }
# Decodificação de PNG/JPEG embarcados como data URL (objeto `image` do
# canvas). Versão pinada na mesma 0.24 que o `printpdf 0.7` usa internamente,
# para que o `Image::try_from(decoder)` aceite os tipos sem coerção.
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
# Decodificação base64 das data URLs (imagens embarcadas em `canvas_json`).
# `engine::general_purpose::STANDARD` é o padrão; sem features extras.
base64 = "0.22"
# Detecção e envio de impressão via driver do SO (WP-09 / SPEC-09).
# `printers` 2.x cobre Windows (Win32 Print Spooler) e Unix (CUPS/lp).
# Expõe enumeração, status e envio raw com a mesma API multiplataforma —
# eliminando a necessidade de FFI manual a `winspool`/`libcups`.
printers = "2.0"
# Pacote `.etlbl` (WP-14 / SPEC-11): ZIP com manifest + assets + thumbnail.
# `zip` 0.6 oferece reader/writer puros sem dependência de OpenSSL; basta
# para o nosso uso (deflate). `sha2` calcula o hash SHA-256 que vai no
# `manifest.json` para validar integridade do conteúdo no import.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Logging estruturado com rotação (WP-16 / SPEC-13).
# `tracing` é a fachada usada em todo o backend. `tracing-subscriber` instala
# o consumidor global (formatador + filtro). `tracing-appender` faz a
# rotação diária do arquivo de log. Já estavam disponíveis transitivamente
# via `sqlx`/`tauri`; declaramos explicitamente para garantir versão estável
# e não depender de re-export indireto.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[features]
# Esta feature é habilitada pelo `tauri dev` automaticamente; necessária para dev tools.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"        # Builds menores, runtime mais rápido.
codegen-units = 1      # Otimização máxima por crate.
lto = true             # Link-time optimization.
opt-level = "s"        # Otimizar tamanho (relevante para cold start ≤ 3 s).
strip = true           # Remover símbolos de debug.
