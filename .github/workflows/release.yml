name: release

# Pipeline de release multiplataforma do Bartender.
#
# Disparo:
#   - Push de tag `vX.Y.Z` (semver). Caminho normal.
#   - workflow_dispatch (UI do GitHub Actions) com a tag como input.
#     Use para re-rodar uma release que falhou em alguma plataforma sem
#     precisar criar uma tag nova.
#
# Plataformas geradas em paralelo (matrix):
#   - Windows 10/11 x86_64 → .msi (instalador WiX em pt-BR)
#   - macOS universal       → .dmg (Intel + Apple Silicon)
#   - Linux x86_64          → .deb + .AppImage
#
# Fluxo:
#   prepare        → valida que `package.json`, `Cargo.toml` e
#                    `tauri.conf.json` declaram a mesma versão da tag.
#   create-draft   → cria a GitHub Release como **draft** com release
#                    notes auto-geradas (commits desde a tag anterior).
#                    Mantém em draft enquanto os builds sobem assets.
#   build (matrix) → 3 jobs paralelos. Cada SO compila + faz upload dos
#                    instaladores diretamente para a draft.
#   publish        → promove a draft a release publicada. Roda apenas se
#                    TODAS as plataformas da matrix tiverem sucesso.
#
# Assinatura digital (Windows EV/Standard e Apple Developer ID) fica para
# uma fase futura quando os certificados estiverem em mãos. O workflow
# expõe os secrets esperados — basta cadastrá-los e a action os usa
# automaticamente.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para construir/republicar (ex.: v0.1.0). Deve existir no repo.'
        required: true
        type: string

permissions:
  contents: write

# Evita que duas tags simultâneas se atrapalhem. `cancel-in-progress: false`
# para não cancelar uma release em meio de upload por causa de outra.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — valida que tudo está em sync antes de gastar 30+ min em build.
  # ---------------------------------------------------------------------------
  prepare:
    name: Validar versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver tag e validar sync de versão
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::Tag '$TAG' não segue o padrão semver vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep '^version' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Tag:                $TAG (versão $VERSION)"
          echo "package.json:       $PKG"
          echo "Cargo.toml:         $CARGO"
          echo "tauri.conf.json:    $CONF"
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CARGO" ] || [ "$VERSION" != "$CONF" ]; then
            echo "::error::Versão fora de sync. Faça bump em todos os arquivos antes de tagear."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 2 — cria a release em draft. A draft é o "ponto de encontro" dos jobs
  # de build (cada um faz upload dos seus assets para o mesmo release_id).
  # ---------------------------------------------------------------------------
  create-draft:
    name: Criar release (draft)
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo para o `generate_release_notes` listar commits
          # desde a última tag.
          fetch-depth: 0

      - name: Criar/atualizar draft
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Bartender ${{ needs.prepare.outputs.tag }}
          draft: true
          generate_release_notes: true
          body: |
            ## Bartender ${{ needs.prepare.outputs.tag }}

            Aplicativo desktop offline-first para criação e impressão de etiquetas com suporte a Argox (PPLB), Zebra (ZPL) e impressão via driver do SO.

            ### Downloads

            | Plataforma | Arquivo | Notas |
            |---|---|---|
            | **Windows 10/11 (64-bit)** | `Bartender_${{ needs.prepare.outputs.version }}_x64_pt-BR.msi` | Requer WebView2 (já vem com Windows 10 1809+ e Windows 11) |
            | **macOS Intel + Apple Silicon** | `Bartender_${{ needs.prepare.outputs.version }}_universal.dmg` | macOS 12 Monterey ou superior |
            | **Linux (Debian/Ubuntu)** | `bartender_${{ needs.prepare.outputs.version }}_amd64.deb` | Ubuntu 22.04+, Debian 12+ |
            | **Linux (AppImage portátil)** | `bartender_${{ needs.prepare.outputs.version }}_amd64.AppImage` | Qualquer distro x86_64 com glibc 2.35+ |

            ### Instalação

            - **Windows:** abra o `.msi`, "Avançar" até o fim. O app fica em `Iniciar > Bartender`.
            - **macOS:** abra o `.dmg`, arraste o app para a pasta Aplicativos. Na primeira abertura, segure ⌃ (Control) + clique no app e escolha "Abrir" (binário não-assinado).
            - **Linux .deb:** `sudo dpkg -i bartender_*.deb` ou abra com o Discover/Software.
            - **Linux AppImage:** `chmod +x bartender_*.AppImage && ./bartender_*.AppImage`.

  # ---------------------------------------------------------------------------
  # Job 3 — matrix de build. Cada SO compila e faz upload para a draft em
  # paralelo. `fail-fast: false` garante que uma falha (ex.: signing macOS
  # transitório) não cancele os outros — assim você ainda tem 2 dos 3
  # instaladores e pode rerunear só o que falhou via workflow_dispatch.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.label }})
    needs: [prepare, create-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal (Intel + Apple Silicon)
            os: macos-latest
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_args: '--target universal-apple-darwin --bundles app,dmg'

          - label: Linux x86_64
            os: ubuntu-22.04
            rust_targets: ''
            tauri_args: '--bundles deb,appimage'

          - label: Windows x86_64
            os: windows-latest
            rust_targets: ''
            tauri_args: '--target x86_64-pc-windows-msvc --bundles msi'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Cache do Rust dramatic reduz o build de ~12 min para ~3-4 min em
      # re-runs. `key` inclui o OS para isolar caches entre plataformas.
      - name: Cache Rust deps
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      # Linux precisa do toolkit GTK/WebKit em runtime e libs de bundling.
      # `webkit2gtk-4.1` é o requerido por Tauri 2.x (em vez do 4.0 do Tauri 1.x).
      # As libs adicionais (`libfontconfig1-dev`, `libfreetype6-dev`, `libcups2-dev`,
      # `libexpat1-dev`, `libbz2-dev`, `libbrotli-dev`) são exigidas pelo
      # `font-kit 0.14` (via `freetype-sys` + `yeslogic-fontconfig-sys`) e
      # pela crate `printers` na fase de link.
      - name: Dependências do SO (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libexpat1-dev \
            libbz2-dev \
            libbrotli-dev \
            libcups2-dev \
            patchelf \
            file \
            fuse \
            libfuse2

      - name: Instalar deps npm
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # Guard de signing.
      #
      # `tauri-action` quebra com "security: SecKeychainItemImport: One or
      # more parameters passed to a function were not valid" quando recebe
      # APPLE_CERTIFICATE definido mas com valor inválido/vazio. Isso
      # acontece se você cadastrou os secrets sem o .p12 real.
      #
      # Aqui detectamos se cada conjunto de credenciais está realmente
      # presente. Só nesse caso exportamos as envs APPLE_* / Windows
      # thumbprint para o build seguinte via $GITHUB_ENV.
      #
      # Sem credenciais: build prossegue não-assinado. O usuário final
      # precisa de Control+clique no macOS e "Executar assim mesmo" no
      # Windows SmartScreen — comportamento documentado em docs/release.md.
      # ─────────────────────────────────────────────────────────────────────
      - name: Detectar credenciais de signing
        id: signing
        shell: bash
        env:
          MACOS_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_PW: ${{ secrets.APPLE_PASSWORD }}
          MACOS_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          WIN_THUMBPRINT: ${{ secrets.TAURI_SIGNING_CERTIFICATE_THUMBPRINT }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MAC_SIGN=0
          WIN_SIGN=0

          # macOS: exige .p12 (base64) + senha + signing identity completa.
          # Os outros (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) só são usados
          # para notarização — se faltarem, o build sai apenas assinado mas
          # não notarizado.
          if [[ -n "$MACOS_CERT" && -n "$MACOS_CERT_PW" && -n "$MACOS_IDENTITY" ]]; then
            MAC_SIGN=1
            echo "::notice::macOS signing: credenciais encontradas, ativando codesign."
            {
              echo "APPLE_CERTIFICATE=$MACOS_CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_CERT_PW"
              echo "APPLE_SIGNING_IDENTITY=$MACOS_IDENTITY"
            } >> "$GITHUB_ENV"
            # Notarização é opt-in adicional: só se os 3 secrets de Apple ID estiverem presentes.
            if [[ -n "$MACOS_APPLE_ID" && -n "$MACOS_APPLE_PW" && -n "$MACOS_TEAM" ]]; then
              echo "::notice::macOS notarization: credenciais encontradas, ativando notarize."
              {
                echo "APPLE_ID=$MACOS_APPLE_ID"
                echo "APPLE_PASSWORD=$MACOS_APPLE_PW"
                echo "APPLE_TEAM_ID=$MACOS_TEAM"
              } >> "$GITHUB_ENV"
            else
              echo "::warning::macOS: assinando MAS não notarizando (APPLE_ID/PASSWORD/TEAM_ID ausentes ou incompletos)."
            fi
          else
            echo "::warning::macOS signing: credenciais ausentes — DMG sairá não-assinado (usuários precisarão de Ctrl+clique)."
          fi

          # Windows: basta a thumbprint do certificado já instalado no runner.
          # (Cert preinstalado é fora do escopo deste workflow — futura fase.)
          if [[ -n "$WIN_THUMBPRINT" ]]; then
            WIN_SIGN=1
            echo "::notice::Windows signing: thumbprint encontrada, ativando code signing."
            echo "TAURI_SIGNING_CERTIFICATE_THUMBPRINT=$WIN_THUMBPRINT" >> "$GITHUB_ENV"
          else
            echo "::warning::Windows signing: thumbprint ausente — MSI sairá não-assinado (SmartScreen avisará)."
          fi

          # Updater Tauri: desativado por design (offline-first).
          # Só passamos se ambos estiverem definidos — evita mesmo problema
          # de "key inválida" com valor parcial.
          if [[ -n "$UPDATER_KEY" && -n "$UPDATER_KEY_PW" ]]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=$UPDATER_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PW"
            } >> "$GITHUB_ENV"
          fi

          echo "mac_sign=$MAC_SIGN" >> "$GITHUB_OUTPUT"
          echo "win_sign=$WIN_SIGN" >> "$GITHUB_OUTPUT"

      # `tauri-action@v0` é a action oficial. Ela:
      #   1. Roda `tauri build` com os args da matrix.
      #   2. Pega cada arquivo final em `src-tauri/target/.../bundle/`.
      #   3. Faz upload na release apontada por `releaseId`.
      #
      # As envs APPLE_* / TAURI_SIGNING_* foram seletivamente populadas pelo
      # passo anterior — passamos apenas `GITHUB_TOKEN` aqui de forma fixa.
      - name: Build Tauri + upload de assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-draft.outputs.release_id }}
          args: ${{ matrix.tauri_args }}

  # ---------------------------------------------------------------------------
  # Job 4 — promove a draft a release publicada. Só executa se TODAS as
  # plataformas da matrix tiverem subido seus assets.
  # ---------------------------------------------------------------------------
  publish:
    name: Publicar release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Promover draft → published
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          # `make_latest: true` marca essa release como "Latest" no GitHub —
          # é o que aponta para `/releases/latest` (URL usada pela página
          # de download no site).
          make_latest: 'true'
